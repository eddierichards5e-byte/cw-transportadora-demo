<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — CW Transportadora</title><link rel="stylesheet" href="/static/css/app.css"></head><body class="login"><section class="login-card"><div class="logo big">CW</div><h1>CW Transportadora</h1><p>Entre para acessar o painel operacional.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post" action="/login">{{ csrf_input(request) }}<label>Usuário<input name="usuario" autocomplete="username" required></label><label>Senha<input type="password" name="senha" autocomplete="current-password" required></label><button class="primary">Entrar</button></form></section></body></html>
